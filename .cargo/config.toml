# Réglages de compilation partagés par tout le workspace.

# Windows (MSVC) : le runtime C de Visual Studio est intégré au binaire (`crt-static`).
# Sans cela, `raftup.exe` dépend de `VCRUNTIME140.dll`, absente d'un Windows neuf : le
# launcher ne démarrerait pas chez un joueur qui n'a jamais installé le « Visual C++
# Redistributable ». Les `api-ms-win-crt-*` restent dynamiques : Windows 10 et 11 les
# fournissent toujours.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Pour `cargo test` et `cargo run` seulement (pas pour l'exe livré, lancé hors de cargo) :
# le serveur de partie n'écoute que sur ce PC. Sans cela, chaque nouvel exécutable de
# test ouvre la fenêtre du pare-feu Windows « Autoriser sur les réseaux publics ».
# Une variable déjà définie dans le terminal garde la priorité (pas de `force`).
[env]
RAFTUP_LISTEN_HOST = "127.0.0.1"

# `cargo captures` : un PNG de chaque écran du launcher dans `target/captures/`, sans
# ouvrir de fenêtre (rendu wgpu ; sous Linux sans carte graphique, Mesa lavapipe).
# Voir crates/launcher-ui/src/ui_tests/captures_interface.rs.
[alias]
captures = "test -p launcher-ui --bin raftup ui_tests::captures_interface -- --ignored --nocapture"
