[[steps]]
id = "archipelago-hk"
kind = "mod"
name = "Archipelago (Hollow Knight)"
version = "0.12.0.0"               # vérifié : ModLinks.xml (tag v0.12.0)
source = { url = "https://github.com/ArchipelagoMW-HollowKnight/Archipelago.HollowKnight/releases/download/v0.12.0/Archipelago.zip" }
sha256 = "f54fb0972129028393a174daefa159d64a83c71789e2fd5f59583c856231d611"  # vérifié : = ModLinks.xml
max_bytes = 2000000                # fichier : 472 765 octets
# Zip à plat (vérifié) : Archipelago.HollowKnight.dll/.pdb, Archipelago.MultiClient.Net.dll,
# Archipelago.Gifting.Net.dll, README.md.
# À vérifier : compatibilité de la version 0.12.0 du mod avec le monde hk d'Archipelago 0.6.8.
install = { extract = "zip", into = "{game_dir}/hollow_knight_Data/Managed/Mods/Archipelago", strip_prefix = "" }

# [preserve] et [cleanup] : rien. Les réglages des mods (…GlobalSettings.json) et les sauvegardes
# vivent dans le dossier utilisateur du jeu (AppData\LocalLow\Team Cherry\Hollow Knight, à
# vérifier), hors de {game_dir} ; aucun fichier créé dans {game_dir} n'est documenté.

[launch]
exe = "{game_dir}/hollow_knight.exe"   # vérifié : même nom que expected_exe (Lumafly, Steam)
# Méthode « manual » : le guide officiel ne documente que la saisie dans le menu du jeu.
# vérifié : guide setup_en.md 0.6.8 et README du mod (nouvelle partie, mode Archipelago, Start).
# vérifié : ConnectionDetails.cs du mod (branche master) a des champs séparés ServerUrl,
# ServerPort, SlotName, ServerPassword → hôte et port séparés. Libellés exacts du menu : à vérifier.
connect = { method = "manual", instructions = "Dans le jeu : nouvelle partie, choisir le mode Archipelago, puis saisir le serveur {host}, le port {port} (adresse complète : {address}), le slot {slot} et le mot de passe s'il y en a un. Appuyer sur Start : le jeu se fige quelques secondes pendant le placement des objets." }
