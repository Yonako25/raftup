sha256 = "1610837e5cc077aec82b29a9e48e34125fb35b04cd9e4f03bc7bdf15208bb4ed"  # vérifié : = ModLinks.xml
max_bytes = 2000000                # fichier : 745 026 octets
# Zip à plat (vérifié) : Benchwarp.dll/.pdb, README.md.
install = { extract = "zip", into = "{game_dir}/hollow_knight_Data/Managed/Mods/Benchwarp", strip_prefix = "" }

[[steps]]
id = "vasi"
kind = "mod"
name = "Vasi"
version = "2.0.0.0"                # vérifié : ModLinks.xml
