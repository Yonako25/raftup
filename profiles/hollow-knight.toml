sha256 = "b93fa7ecdf40d5f91f942acfd31cd2a5243551720c96e18dde99fd64919162ec"  # vérifié : = ModLinks.xml
max_bytes = 1000000                # fichier : 20 796 octets
# Zip à plat (vérifié) : Vasi.dll/.pdb, README.md.
install = { extract = "zip", into = "{game_dir}/hollow_knight_Data/Managed/Mods/Vasi", strip_prefix = "" }

[[steps]]
id = "qol"
