# Pas de [preserve] : on ne sait pas encore où le mod garde l'adresse et le slot (à vérifier).
# Pas de [cleanup] : les fichiers créés par BepInEx et les mods en tournant restent à observer en vrai.

[launch]
exe = "{game_dir}/Blasphemous.exe"
# Vérifié : setup_en.md (0.6.8) et README du Multiworld : un menu demande la connexion en
# choisissant une sauvegarde (exemple du README : « Server ip: ap:55858 »).
connect = { method = "manual", instructions = "Choisis une sauvegarde vide : un menu demande l'adresse du serveur ({address}), ton nom ({slot}) et le mot de passe si besoin, puis valide. La console (touche \\) donne « ap status » pour vérifier la connexion." }
