# Blasphemous (Randomizer et Multiworld de BrandenEK / Damocles et TRPG), écrit le 2026-11-22,
# jamais essayé en vrai (status = "untested", ADR 0049).
# Monde intégré à Archipelago 0.6.8 (worlds/blasphemous). Le guide officiel (docs/setup_en.md,
# tag 0.6.8) renvoie au Mod Installer de BrandenEK (BrandenEK/Blasphemous.Modding.Installer) et
# demande le mod Multiworld. Installation manuelle sous Windows (docs/install/blas1_windows.md de
# l'installateur) : outils de modding (win64.zip) à la racine du jeu, puis chaque mod extrait
# dans le dossier « Modding », avec ses dépendances.
# Dépendances : BlasphemousMods.json de l'installateur (branche main, 2026-11-22) :
#   Multiworld → Modding API, Menu Framework, Randomizer, Cheat Console ;
#   Randomizer → Modding API, Credits Framework, Level Framework, Menu Framework, UI Framework,
#   Cheat Console ; Menu Framework → Modding API, UI Framework ; les autres → Modding API.
# Ordre des étapes : dépendances d'abord.
# Mods facultatifs non installés : Rando Map, Boots of Pleading (obligatoire si l'option
# « Boots of Pleading » est activée) et Double Jump (obligatoire si l'option « Purified Hand of
# the Nun » est activée, demande aussi Item Framework). À ajouter plus tard si besoin.
# Fichier de release : l'installateur prend le premier asset de la dernière release
# (ModLoader.cs, Assets[0]) ; le workflow build.yml de chaque mod publie « <TargetName>.zip »
# (TargetName lu dans le .csproj). Versions : dernier tag de chaque dépôt (git ls-remote) ;
# que ce tag soit aussi la dernière release publiée reste à vérifier (API GitHub injoignable).
# À vérifier : le mod Multiworld annonce la version 0.5.0 du protocole (APManager.cs) ; marche
# avec un serveur 0.6.8 a priori (rétrocompatible), mais pas essayé.
# Hashes : sha256sum des fichiers téléchargés le 2026-11-22.

format_version = 1

[game]
id = "blasphemous"
name = "Blasphemous"
ap_game = "Blasphemous"            # vérifié : game = "Blasphemous" dans worlds/blasphemous/__init__.py (0.6.8)
status = "untested"

[game.detect]
steam_appid = 774361               # vérifié : API du Steam Store, appid 774361 = « Blasphemous » (type game)
expected_exe = "Blasphemous.exe"   # vérifié : Core.cs de l'installateur de BrandenEK cherche « Blasphemous.exe »

[credits]
authors = [
  "BrandenEK (Damocles) et TRPG (Multiworld, MIT)",
  "BrandenEK (Damocles) (Randomizer, Modding API, UI/Menu/Credits/Level Framework, Cheat Console, MIT)",
  "BrandenEK (outils de modding)",
  "équipe BepInEx (BepInEx et Doorstop, LGPL-2.1)",
]
# Vérifié : docs/LICENSE.md (MIT) des huit dépôts de mods. Le dépôt des outils de modding
# (BrandenEK/Blasphemous.ModdingTools) n'a pas de fichier de licence (ADR 0050) ; il regroupe
# BepInEx et Doorstop (LGPL-2.1), BepInEx.MultiFolderLoader et Newtonsoft.Json (MIT, licences
# non relues une à une). Le zip du Multiworld embarque aussi c-wspp (son LICENSE est fourni dans
# le zip), websocket-sharp et Archipelago.MultiClient.Net (MIT, non relus).
license = "MIT AND LGPL-2.1-only"

[[steps]]
id = "modding-tools"
kind = "mod_loader"
name = "Outils de modding (BepInEx)"
version = "2.1.0"                  # vérifié : win64/.modtools_version au commit 2f27f92 (le fichier modding-tools-windows.version dit encore 2.0.0)
# Fichier versionné dans le dépôt (pas de release) : URL épinglée sur le commit, pour que le
# sha256 ne change jamais. github.com redirige vers raw.githubusercontent.com, comme pour
# A Short Hike. À vérifier : cette URL github.com/…/raw/… renvoyait 403 depuis la session
# (proxy) ; le hash vient du même fichier pris sur raw.githubusercontent.com au même commit, et
# du clone git (identiques).
source = { url = "https://github.com/BrandenEK/Blasphemous.ModdingTools/raw/2f27f92a7f12860cd07261e23134fcff344405c3/win64.zip" }
sha256 = "c5ae844735708395bd071149a1adaeed60050d1873e04162ef518162f0f5ff37"
max_bytes = 5000000                # fichier : 828 881 octets
# Le zip contient winhttp.dll, doorstop_config.ini, steam_appid.txt, .doorstop_version,
# .modtools_version, BepInEx/{config,core,patchers}/…, Modding/plugins/ et
# Blasphemous_Data/Managed/Newtonsoft.Json.dll à la racine (vérifié par unzip -l) ; un fichier du
# jeu remplacé est sauvegardé puis restauré à la désinstallation.
install = { extract = "zip", into = "{game_dir}", strip_prefix = "" }

[[steps]]
id = "modding-api"
kind = "mod"
name = "Modding API"
version = "3.0.1"                  # vérifié : dernier tag de BrandenEK/Blasphemous.ModdingAPI
source = { url = "https://github.com/BrandenEK/Blasphemous.ModdingAPI/releases/download/3.0.1/ModdingAPI.zip" }
sha256 = "b74fe3900b563483d090fd7f01939fe7d60ba5711e83d7996396a274e7156ff7"
max_bytes = 1000000                # fichier : 18 271 octets
# Le zip contient plugins/ModdingAPI.dll (vérifié) → Modding/plugins/.
install = { extract = "zip", into = "{game_dir}/Modding", strip_prefix = "" }

