<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · Rafthub</title>
<link rel="stylesheet" href="/admin/static/rafthub.css">
</head>
<body>
<main class="center">
<div class="panel login">
<div class="brand">
<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 18 L14 22 L25 18" fill="none" stroke="#3D8BFF" stroke-width="2.2"/><path d="M5 13 L14 16.5 L23 13" fill="none" stroke="#9AA8B6" stroke-width="2.2"/><path d="M14 3 L14 13" stroke="#E6ECF2" stroke-width="2.2"/><path d="M14 4 L21 10 L14 10 Z" fill="#3D8BFF"/></svg>
<div><div class="brand-name">RAFTHUB</div><div class="muted small">Console d'admin</div></div>
</div>
<h1>Connexion</h1>
{% if let Some(message) = error %}<p class="alert" role="alert">{{ message }}</p>{% endif %}
<form method="post" action="/admin/login" class="form">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label for="email">E-mail ou pseudo</label>
<input id="email" name="email" type="text" autocomplete="username" spellcheck="false" required value="{{ email }}">
<label for="password">Mot de passe</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit" class="button">Se connecter</button>
</form>
<p class="muted small">Réservé aux admins de ce hub. Pour faire d'un compte existant un admin, sur le serveur : <code>rafthub admin create &lt;e-mail&gt;</code>.</p>
</div>
</main>
</body>
</html>
