[package]
name = "hub"
description = "Rafthub : comptes, amis, présence et console d'admin (ADR 0002, 0003, 0033, 0036)"
version.workspace = true
edition.workspace = true
# Seule crate du dépôt sous AGPL (ADR 0003). Aucune crate MIT/Apache ne doit dépendre d'elle.
# Texte de la licence : `LICENSE-AGPL`, à côté de ce fichier.
license = "AGPL-3.0-or-later"
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "rafthub"
path = "src/main.rs"

# Licences des dépendances vérifiées le 19 novembre 2026 : voir docs/adr/0033-hub-http-stockage-sessions.md.
[features]
# Version officielle de Rafthub (serveur du projet) : la connexion Discord peut y
# être activée. Sans cette option (Rafthub auto-hébergé, binaires des releases),
# Discord n'est ni affiché ni activable : pseudo ou e-mail et mot de passe (ADR 0038).
officiel = []

[dependencies]
# Serveur HTTP (MIT), sur tokio comme le reste de Raftup.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "form", "tokio"] }
# Accès à la base (MIT OR Apache-2.0) : SQLite (compilé avec la crate), PostgreSQL et
# MySQL / MariaDB (ADR 0037), derrière
# le pilote générique `any` (ADR 0033). Pas de macros : les requêtes sont vérifiées par les tests.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "mysql"] }
# Gabarits HTML de la console d'admin (MIT OR Apache-2.0), vérifiés à la compilation,
# échappement HTML automatique (ADR 0036).
askama = "0.14"
# Hachage des mots de passe (argon2id, MIT OR Apache-2.0), sel tiré par le système.
argon2 = { version = "0.5", features = ["std"] }
# Envoi des e-mails par SMTP (MIT), en TLS avec rustls + ring comme le reste du dépôt.
# Transport synchrone, appelé sur un thread à part (ADR 0033).
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "rustls-tls"] }
# Client HTTPS synchrone pour parler à Discord (MIT OR Apache-2.0), déjà utilisé par le launcher.
ureq.workspace = true
# Paramètres encodés de l'adresse d'autorisation Discord (MIT OR Apache-2.0).
url = "2"
# Défi PKCE en base64 « URL » (MIT OR Apache-2.0).
base64 = "0.22"
# Forme normalisée des pseudos (NFKC), MIT OR Apache-2.0.
unicode-normalization = "0.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync"] }
tracing.workspace = true
# Distribution du launcher (ADR 0036) : signature minisign de l'exe officiel et
# versions (MIT), zip servi aux joueurs (MIT). Mêmes crates que `launcher-core`.
minisign-verify.workspace = true
semver.workspace = true
zip.workspace = true
# Fichier `rafthub-data/rafthub.toml` : base choisie au premier lancement (ADR 0037).
toml.workspace = true
# Binaire seulement.
anyhow.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `oneshot` : envoie une requête au routeur sans ouvrir de port (MIT).
tower = { version = "0.5", default-features = false, features = ["util"] }
tempfile.workspace = true
# Signer un faux exe avec une clé générée dans le test (distribution, MIT).
minisign.workspace = true
# Test de bout en bout avec le vrai client du launcher (`tests/launcher_discord.rs`).
# Sens permis : le hub (AGPL) dépend du launcher (MIT / Apache), jamais l'inverse.
launcher-core = { path = "../launcher-core" }
