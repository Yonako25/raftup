[package]
name = "launcher-ui"
description = "Launcher de bureau Raftup (egui), compatible avec Archipelago"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Le binaire s'appelle `raftup` : c'est le programme que lance le joueur.
default-run = "raftup"

[lints]
workspace = true

[[bin]]
name = "raftup"
path = "src/main.rs"

[dependencies]
# CLAUDE.md : l'interface ne dépend que de launcher-core (ADR 0011 : egui à la place de Tauri).
launcher-core.workspace = true
eframe.workspace = true
egui.workspace = true
arboard.workspace = true
rfd.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry", "fmt"] }
anyhow.workspace = true
# PNG des captures de la macro de développement (`devscript.rs`) ; déjà tiré par eframe.
image = { version = "0.25", default-features = false, features = ["png"] }

# Linux et BSD (NF11) : rfd exige exactement un moteur de boîtes de fichiers, sinon son
# `build.rs` s'arrête. « xdg-portal » passe par le portail du bureau (D-Bus), en Rust pur,
# sans bibliothèque GTK à installer. Windows et macOS utilisent les boîtes natives.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
rfd = { workspace = true, features = ["xdg-portal"] }

[dev-dependencies]
# Dossier temporaire pour le test de détection de l'écran Bibliothèque.
tempfile.workspace = true
# Tests de l'interface sans ouvrir de fenêtre (`src/ui_tests/`, voir `tests/README.md`).
egui_kittest.workspace = true
