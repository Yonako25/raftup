[package]
name = "server"
description = "Serveur de parties multimondes compatible avec Archipelago, sur tokio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "raftup-server"
path = "src/bin/raftup-server.rs"

[dependencies]
ap-protocol.workspace = true
multidata.workspace = true
futures-util.workspace = true
indexmap.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# rt-multi-thread et signal : pour le binaire (plusieurs cœurs, Ctrl+C) ;
# sync : canaux entre les connexions et la tâche salle (ADR 0006).
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
# Binaire raftup-server seulement.
anyhow.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
futures-util.workspace = true
indexmap.workspace = true
serde_json.workspace = true
tokio-tungstenite.workspace = true
