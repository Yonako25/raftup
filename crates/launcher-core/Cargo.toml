[package]
name = "launcher-core"
description = "Cœur du launcher Raftup : héberger et suivre une partie, sans interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
multidata.workspace = true
server.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing.workspace = true
# Couche qui garde le journal du serveur en mémoire pour l'afficher.
tracing-subscriber = { workspace = true, features = ["registry"] }
toml.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
ureq.workspace = true
directories.workspace = true
keyvalues-parser.workspace = true
# Liens d'invitation `raftup://` (ADR 0020).
percent-encoding.workspace = true
client-core.workspace = true
# Pont vers le générateur Python officiel (ADR 0016, 0017).
py-bridge.workspace = true
# Moteur de génération Rust (ADR 0027).
generate.workspace = true
sha2.workspace = true
# Lire les manifestes Epic (JSON) et fusionner les fichiers de config des mods.
serde_json.workspace = true
# Mise à jour automatique : signature minisign et versions (ADR 0022).
minisign-verify.workspace = true
semver.workspace = true
# Registre de paquets signés (ADR 0032), sans la fonctionnalité `publish` (pas de signature).
registry.workspace = true

# Registre Windows : seulement compilé sous Windows.
[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test réel de l'export des mondes (ADR 0028) : comparaison des mondes de `logic`.
logic.workspace = true
# Signer un faux binaire dans les tests de update.rs.
minisign.workspace = true
# Tests du registre : un index produit par la vraie publication, puis relu par le launcher.
registry = { workspace = true, features = ["publish"] }
# Certificat auto-signé pour le test du diagnostic TLS (diagnose.rs).
rcgen.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tokio-tungstenite.workspace = true

# Outil de publication : ses tests (keygen, sign, manifest) tournent avec `cargo test`.
[[example]]
name = "update_tool"
test = true
