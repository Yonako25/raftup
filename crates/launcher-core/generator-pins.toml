# Épinglage du générateur Archipelago (ADR 0017).
#
# Tout ce que le launcher télécharge au premier usage pour générer une seed est listé ici,
# avec son adresse HTTPS, sa taille maximale et son sha256. Les valeurs ont été relevées
# sur les fichiers réellement téléchargés (jamais écrites de mémoire) et les hash des wheels
# ont été comparés à ceux publiés par PyPI, celui de Python à `SHA256SUMS` de la release.
# Pour monter de version : changer ce fichier seul, puis lancer le test réel `#[ignore]`.
# Rien de ce qui est téléchargé ici n'est redistribué par Raftup.

format_version = 1

# Python autonome (python-build-standalone, release du 10 novembre 2026), Windows x86_64.
[python]
version = "3.12.16+20261110"
url = "https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.12.16%2B20261110-x86_64-pc-windows-msvc-install_only.tar.gz"
sha256 = "e23fe5b16926de1d81661b1a97352e89fb167549c55a6825796ccd0f32ec7f1b"
# Taille réelle relevée sur le fichier téléchargé ; plafond : 96 Mio.
size = 47438699
max_bytes = 100663296
# Dossier racine de l'archive (3461 entrées relevées).
strip_prefix = "python"
max_entries = 6000

# Code d'Archipelago 0.6.8, archive GitHub du commit épinglé.
[archipelago]
version = "0.6.8"
url = "https://github.com/ArchipelagoMW/Archipelago/archive/54803be064fc7e80c4628777ed0b46a9390f255f.zip"
sha256 = "3b9c408cd43b09ab27691d5a0b8d18686cd113ebdd06fdd9606c229010648ef8"
# Taille réelle relevée sur le fichier téléchargé ; plafond : 64 Mio.
size = 23193480
max_bytes = 67108864
strip_prefix = "Archipelago-54803be064fc7e80c4628777ed0b46a9390f255f"
# 4050 entrées relevées.
max_entries = 8000

