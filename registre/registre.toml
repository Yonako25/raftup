# Source du registre de paquets signés de Raftup (ADR 0032).
#
# Ce fichier est relu par la mainteneuse, puis transformé en `index.json` signé par
# `raftup-registry publish` (procédure : `registre/README.md`).
#
# Règles :
# - le registre ne contient que des RÉFÉRENCES : `url` pointe chez l'auteur du paquet ;
#   Raftup ne redistribue jamais de jeu, de ROM, d'asset ni de mod ;
# - `file` est une copie locale du même fichier, téléchargée chez l'auteur, qui sert
#   seulement à calculer sha256 et taille. Elle va dans `registre/fichiers/`, qui n'est
#   jamais commité (`.gitignore`) ;
# - pour une apworld, `name` est le nom du dossier du monde dans le zip : le launcher la
#   pose sous `<name>.apworld`, le nom sous lequel Archipelago l'importe ;
# - une seule version par paquet ; un jeu du catalogue embarqué garde toujours son profil.

format_version = 1
registry = "raftup"

# Apworld de Slime Rancher (mod Slimipelago de SWCreeperKing), la même que celle du profil
# embarqué `profiles/slime-rancher.toml` (même URL, même version). Sans licence : décision
# de la mainteneuse dans l'ADR 0021. sha256 attendu (celui du profil) :
# 12ade0764bcfb515ecec2f4cf3bda01fd914c8b8f7b1b4572ecae4693450d038
[[package]]
kind = "apworld"
name = "slime_rancher"
version = "0.3.2.1"
game = "Slime Rancher"
file = "fichiers/slime_rancher.apworld"
url = "https://github.com/SWCreeperKing/Slimipelago/releases/download/v0.3.2.1/slime_rancher.apworld"
license = "unlicensed"
authors = ["SWCreeperKing"]
