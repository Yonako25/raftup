# Page d'attente de raftup-games.com : fichiers statiques seulement.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # En-têtes de sécurité : rien d'autre que ce site (pas de script du tout).
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / { try_files /index.html =404; }
    # Licences des polices (OFL), listées.
    location /fonts/ { autoindex on; }
    location / { try_files $uri =404; }
}
