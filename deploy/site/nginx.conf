# Site officiel de raftup-games.com : fichiers statiques seulement.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # Derrière Traefik, le port interne (8080) ne doit pas apparaître dans les
    # redirections (/jeux → /jeux/) : on les écrit sans hôte ni port.
    absolute_redirect off;

    # En-têtes de sécurité : rien d'autre que ce site, aucun script, aucun style en ligne.
    # Attention : un `add_header` placé dans un `location` effacerait ceux-ci ;
    # les durées de cache passent donc par `expires`.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    error_page 404 /404.html;

    # Pages : chaque dossier a son index.html (/docs/faq/).
    location / { try_files $uri $uri/ =404; }
    # Images et polices : changent rarement.
    location /img/ { expires 7d; try_files $uri =404; }
    location /fonts/ { expires 30d; autoindex on; }
    # Feuille de style : revalidée à chaque visite (mise à jour visible tout de suite).
    location = /site.css { expires epoch; }
}
