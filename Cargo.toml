# Workspace Cargo : un seul dépôt qui regroupe plusieurs « crates » (bibliothèques et binaires).
# Les crates des jalons suivants (multidata, server, client-core…) seront ajoutées ici au fur et à mesure.
[workspace]
resolver = "2"
members = ["crates/ap-protocol", "crates/client-core", "crates/multidata", "crates/server", "crates/launcher-core", "crates/launcher-ui", "crates/py-bridge"]

# Valeurs partagées : chaque crate les reprend avec `xxx.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yonako25/raftup"
# 1.88 : exigé par la crate `zip` (la plus récente des dépendances du launcher).
rust-version = "1.88"

# Versions des dépendances partagées : chaque crate écrit `xxx.workspace = true`.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order : garde l'ordre des clés comme Python ; arbitrary_precision : garde
# les entiers plus grands que u64 sans les arrondir (ADR 0004, pièges connus).
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
indexmap = { version = "2.14", features = ["serde"] }
thiserror = "2"
# Empreinte SHA-256 de la seed dans les sauvegardes .raftup (MIT/Apache-2.0).
sha2 = "0.11"
tracing = "0.1.44"
# Job Object Windows (KILL_ON_JOB_CLOSE), API sûre, MIT OR Apache-2.0 (ADR 0016).
win32job = "2"
# Décompression zlib du fichier .archipelago (moteur en Rust pur par défaut).
flate2 = "1"
tokio = { version = "1.54", features = ["rt", "net", "time", "macros"] }
# Interface du launcher (ADR 0011) : egui via eframe, rendu wgpu, boîtes de fichiers natives.
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37"
rfd = { version = "0.18", default-features = false }
# Heures locales (HH:MM) pour l'activité et le journal.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# WebSocket et TLS en Rust pur, certificats racine intégrés (ADR 0005).
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Moteur de chiffrement de rustls : `ring`. Sans moteur, la première connexion wss
# planterait ; avec un seul moteur activé, rustls l'installe tout seul.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Côté serveur, le TLS passe par tokio-rustls (ADR 0009), déjà tiré par
# tokio-tungstenite ; même moteur `ring` que rustls, pas d'aws-lc.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Tests seulement : certificats auto-signés créés à la volée (ADR 0009).
rcgen = "0.13"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Binaires et exemples seulement (les bibliothèques utilisent thiserror).
anyhow = "1.0.104"
tracing-subscriber = "0.3.23"
# Launcher : profils d'installation et lecture des fichiers de configuration TOML.
toml = "1.2"
# Extraction des zips de mods : décompression deflate seule (pas de chiffrement,
# bzip2, zstd, lzma ni zopfli ; licence MIT).
zip = { version = "9.6", default-features = false, features = ["deflate-flate2"] }
# Extraction des .tar.gz (Python autonome) : lecture des entrées seulement, jamais `unpack`
# (licence MIT OR Apache-2.0). Décompression gzip par `flate2`.
tar = "0.4.46"
# Client HTTP bloquant pour les téléchargements ; TLS par `ring` (pas d'aws-lc).
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
# Dossiers de config, données et cache propres à chaque système.
directories = "6"
# Lecture du format Steam (libraryfolders.vdf, appmanifest) pour détecter les jeux.
keyvalues-parser = "0.2"
# Registre Windows, utilisé seulement sous Windows (licence MIT).
winreg = "0.56"
# Dossiers temporaires pour les tests.
tempfile = "3"
ap-protocol = { path = "crates/ap-protocol" }
client-core = { path = "crates/client-core" }
multidata = { path = "crates/multidata" }
server = { path = "crates/server" }
launcher-core = { path = "crates/launcher-core" }
py-bridge = { path = "crates/py-bridge" }

# Règles du compilateur et de clippy communes à toutes les crates.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Pas d'unwrap()/expect() dans le code de bibliothèque (les tests sont autorisés, voir clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
