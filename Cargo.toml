# Workspace Cargo : un seul dépôt qui regroupe plusieurs « crates » (bibliothèques et binaires).
# Les crates des jalons suivants (multidata, server, client-core…) seront ajoutées ici au fur et à mesure.
[workspace]
resolver = "2"
members = ["crates/ap-protocol", "crates/client-core", "crates/multidata", "crates/server"]

# Valeurs partagées : chaque crate les reprend avec `xxx.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yonako25/raftup"
rust-version = "1.80"

# Versions des dépendances partagées : chaque crate écrit `xxx.workspace = true`.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order : garde l'ordre des clés comme Python ; arbitrary_precision : garde
# les entiers plus grands que u64 sans les arrondir (ADR 0004, pièges connus).
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
indexmap = { version = "2.14", features = ["serde"] }
thiserror = "2"
tracing = "0.1.44"
# Décompression zlib du fichier .archipelago (moteur en Rust pur par défaut).
flate2 = "1"
tokio = { version = "1.54", features = ["rt", "net", "time", "macros"] }
# WebSocket et TLS en Rust pur, certificats racine intégrés (ADR 0005).
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Moteur de chiffrement de rustls : `ring`. Sans moteur, la première connexion wss
# planterait ; avec un seul moteur activé, rustls l'installe tout seul.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Côté serveur, le TLS passe par tokio-rustls (ADR 0009), déjà tiré par
# tokio-tungstenite ; même moteur `ring` que rustls, pas d'aws-lc.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Tests seulement : certificats auto-signés créés à la volée (ADR 0009).
rcgen = "0.13"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# Binaires et exemples seulement (les bibliothèques utilisent thiserror).
anyhow = "1.0.104"
tracing-subscriber = "0.3.23"
ap-protocol = { path = "crates/ap-protocol" }
multidata = { path = "crates/multidata" }

# Règles du compilateur et de clippy communes à toutes les crates.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Pas d'unwrap()/expect() dans le code de bibliothèque (les tests sont autorisés, voir clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
