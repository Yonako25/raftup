name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    # NF11 : le workspace se compile et ses tests passent sous Windows, macOS et Linux.
    # Le code propre à Windows (registre, Job Object, schéma raftup://) est derrière
    # `#[cfg(windows)]`, avec un repli documenté à côté de chaque bloc.
    strategy:
      # Un système en échec n'arrête pas les autres : on veut savoir lesquels cassent.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Linux : en-têtes des bibliothèques de fenêtrage tirées par eframe (X11, Wayland,
      # clavier). Les boîtes de fichiers passent par le portail xdg, sans GTK.
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # NF12 : déjà compris dans `cargo test --workspace`, relancé à part pour que son
      # résultat se lise d'un coup d'œil sur chaque système.
      - name: Empreinte de la seed APQuest (NF12)
        run: cargo test -p generate --test empreinte

  captures-interface:
    # Une image PNG de chaque écran du launcher, rendue sans fenêtre (egui_kittest + wgpu
    # avec le pilote Vulkan logiciel de Mesa, lavapipe). Rangées dans l'artefact
    # `captures-interface` de chaque pull request : on voit l'interface sans lancer Raftup.
    # Ces images servent à regarder : les références comparées pixel par pixel restent
    # celles du test `captures` sous Windows (job `verifier`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système (fenêtrage et Vulkan logiciel)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev \
            mesa-vulkan-drivers
      # Alias de .cargo/config.toml : écrit target/captures/*.png.
      - run: cargo captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-interface
          path: target/captures/
          if-no-files-found: warn

  hub-officiel:
    # ADR 0038 : le Rafthub officiel se compile avec `--features officiel` (Discord possible).
    # Le job `verifier` ne compile que la version publique : ce job vérifie l'autre.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p hub --features officiel --all-targets -- -D warnings
      - run: cargo test -p hub --features officiel
